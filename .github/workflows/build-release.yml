name: "Build & Release"

on:
  pull_request:
    branches: [master]
    paths:
      - "src/**/*.c"
      - "src/**/*.h"
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
    paths:
      - "src/**/*.c"
      - "src/**/*.h"
  workflow_dispatch:
    inputs:
      deploy_type:
        description: '部署类型'
        required: true
        default: 'artifact_only'
        type: choice
        options:
          - artifact_only
          - release

concurrency:
  group: "build-release"
  cancel-in-progress: false

jobs:
  build:
    name: Build on ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    env:
      PROJECT_NAME: ${{ github.event.repository.name }}

    strategy:
      matrix:
        include:
          # 原有 Linux 版本（glibc）
          - os: ubuntu-latest
            platform: Linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: Linux
            arch: arm64
          # 新增 Linux musl 版本（静态编译）
          - os: ubuntu-latest
            platform: Linux
            arch: x64-musl
          - os: ubuntu-24.04-arm
            platform: Linux
            arch: arm64-musl
          # 原有 macOS/Windows 版本
          - os: macos-15-intel
            platform: macOS
            arch: Intel
          - os: macos-latest
            platform: macOS
            arch: arm64
          - os: windows-latest
            platform: Windows
            arch: x64
          - os: windows-11-arm
            platform: Windows
            arch: arm64

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v5

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ~3
          actions-cache-folder: ".xmake-cache"
          build-cache-key: "${{ matrix.platform }}_${{ matrix.arch }}"
          build-cache: true
          package-cache: true

      # x64-musl 专用工具链
      - name: Install Musl Toolchain (x64-musl)
        if: matrix.arch == 'x64-musl'
        run: |
          sudo apt update && sudo apt install -y --no-install-recommends \
            musl-tools \
            gcc-multilib \
            musl-dev
          sudo ln -s /usr/bin/musl-gcc /usr/local/bin/x86_64-linux-musl-gcc || true

      # arm64-musl 专用工具链
      - name: Install Musl Toolchain (arm64-musl)
        if: matrix.arch == 'arm64-musl'
        run: |
          sudo apt update && sudo apt install -y --no-install-recommends \
            musl-tools \
            musl-dev
          sudo apt remove -y gcc-multilib gcc-13-aarch64-linux-gnu || true
          sudo ln -s /usr/bin/musl-gcc /usr/local/bin/aarch64-linux-musl-gcc || true
          sudo ln -s /usr/lib/aarch64-linux-gnu /usr/lib/aarch64-linux-musl || true

      # 修正：Xmake 静态链接参数（移除 =y，改用正确的 --static）
      - name: Build & Package Project
        run: |
          # 提取纯架构（移除 -musl 后缀）
          ARCH_PURE="${{ matrix.arch }}"
          ARCH_PURE=${ARCH_PURE/-musl/}
          
          # 针对 musl 架构配置 Xmake 编译参数
          if [[ "${{ matrix.arch }}" == *-musl ]]; then
            xmake f --yes \
              --plat=linux \
              --arch=${ARCH_PURE} \
              --toolchain=musl \
              --mode=release \
              --ldflags="-static -static-libgcc -static-libstdc++" \
              --linkdirs="/usr/lib/aarch64-linux-musl:/usr/lib/x86_64-linux-musl"
          else
            # 原有普通编译逻辑
            xmake f --yes --mode=release
          fi
          
          # 显式安装依赖
          xmake require --yes
          
          # 构建并打包
          xmake build --yes --verbose
          xmake package --yes --verbose

      - name: Upload Artifact
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/packages/*.zip
            build/packages/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  release:
    if: ${{ (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.deploy_type == 'release') }}
    name: Upload to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    env:
      RELEASE_DIR: "artifacts"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download All Artifacts
        uses: actions/download-artifact@v5
        with:
          path: ${{ env.RELEASE_DIR }}

      - name: Update dev Tag
        run: |
          git tag dev ${{ github.sha }}
          git push origin "refs/tags/dev" --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Continuous dev Build
          body: |
            Automated build from commit ${{ github.sha }}
            - Added Linux musl static build (x64/arm64)
            - Fixed: Corrected Xmake static link parameter (--static instead of --static=y)
            - Deploy type: ${{ github.event_name == 'push' && 'auto-release (push)' || inputs.deploy_type }}
          prerelease: true
          preserve_order: true
          files: |
            ${{ env.RELEASE_DIR }}/**/*.zip
            ${{ env.RELEASE_DIR }}/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  format:
    if: ${{ (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.deploy_type == 'release') }}
    name: Auto Format Code
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ~3
          actions-cache-folder: ".xmake-cache"

      - name: Format C/C++ files
        run: xmake format

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changed=0" >> $GITHUB_OUTPUT
          else
            echo "changed=1" >> $GITHUB_OUTPUT
          fi

      - name: Auto commit and push changes
        if: steps.check_changes.outputs.changed != 0
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "style(format): AUTO format code"
          branch: ${{ github.ref_name }}
          commit_options: "--no-verify --no-signoff"
          file_pattern: "*.h *.c"
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          status_options: "--untracked-files=no"
          add_options: "-u"
          disable_globbing: true