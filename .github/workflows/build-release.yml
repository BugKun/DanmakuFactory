name: "Build & Release"

on:
  pull_request:
    branches: [master]
    paths:
      - "src/**/*.c"
      - "src/**/*.h"
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
    paths:
      - "src/**/*.c"
      - "src/**/*.h"
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Whether to upload to GitHub Release (true/false)'
        required: true
        default: 'true'
        type: choice
        options:
          - true
          - false

concurrency:
  group: "build-release"
  cancel-in-progress: false

jobs:
  build:
    name: Build on ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    env:
      PROJECT_NAME: ${{ github.event.repository.name }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
            arch: x64

          - os: ubuntu-24.04-arm
            platform: Linux
            arch: arm64

          # Linux-musl 专属构建配置
          - os: ubuntu-latest
            platform: Linux-musl
            arch: x64

          - os: macos-15-intel
            platform: macOS
            arch: Intel

          - os: macos-latest
            platform: macOS
            arch: arm64

          - os: windows-latest
            platform: Windows
            arch: x64

          - os: windows-11-arm
            platform: Windows
            arch: arm64

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v5

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ~3
          actions-cache-folder: ".xmake-cache"
          build-cache-key: "${{ matrix.platform }}_${{ matrix.arch }}"
          build-cache: true
          package-cache: true

      # 仅为 Linux-musl 安装 musl 工具链（修正包名问题）
      - name: Install musl toolchain (Linux-musl only)
        if: matrix.platform == 'Linux-musl'
        run: |
          sudo apt-get update
          # Ubuntu 官方源中仅存在 musl-tools 包（包含 musl-gcc）
          sudo apt-get install -y musl-tools
          # 验证 musl-gcc 安装成功并输出版本
          musl-gcc --version
          # 创建通用命名链接，提升兼容性
          sudo ln -sf /usr/bin/musl-gcc /usr/local/bin/x86_64-linux-musl-gcc

      - name: Build & Package Project
        run: |
          # 针对 Linux-musl 配置专属编译参数
          if [ "${{ matrix.platform }}" = "Linux-musl" ]; then
            xmake f --arch=x86_64 --cc=musl-gcc --cxx=musl-g++
            xmake clean
          fi
          # 执行编译打包
          xmake package --yes --verbose

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/packages/*.zip
            build/packages/*.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  release:
    # 根据触发方式决定是否上传到 Release
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 
        (github.event.inputs.upload_to_release == 'true' || github.event_name == 'push')
    name: Upload to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    env:
      RELEASE_DIR: "artifacts"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download All Artifacts
        uses: actions/download-artifact@v5
        with:
          path: ${{ env.RELEASE_DIR }}

      - name: Update dev Tag
        run: |
          git tag dev ${{ github.sha }}
          git push origin "refs/tags/dev" --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Continuous dev Build
          body: Automated build from commit ${{ github.sha }}
          prerelease: true
          preserve_order: true
          files: |
            ${{ env.RELEASE_DIR }}/**/*.zip
            ${{ env.RELEASE_DIR }}/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  format:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    name: Auto Format Code
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ~3
          actions-cache-folder: ".xmake-cache"

      - name: Format C/C++ files
        run: xmake format

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changed=0" >> $GITHUB_OUTPUT
          else
            echo "changed=1" >> $GITHUB_OUTPUT
          fi

      - name: Auto commit and push changes
        if: steps.check_changes.outputs.changed != 0
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "style(format): AUTO format code"
          branch: ${{ github.ref_name }}
          commit_options: "--no-verify --no-signoff"
          file_pattern: "*.h *.c"
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          status_options: "--untracked-files=no"
          add_options: "-u"
          disable_globbing: true