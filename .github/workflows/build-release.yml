name: "Build & Release"

on:
  pull_request:
    branches: [master]
    paths:
      - "src/**/*.c"
      - "src/**/*.h"
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
    paths:
      - "src/**/*.c"
      - "src/**/*.h"
  workflow_dispatch:
    inputs:
      deploy_type:
        description: '部署类型'
        required: true
        default: 'artifact_only'
        type: choice
        options:
          - artifact_only
          - release

concurrency:
  group: "build-release"
  cancel-in-progress: false

jobs:
  build:
    name: Build on ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    env:
      PROJECT_NAME: ${{ github.event.repository.name }}
      # 全局环境变量
      XMAKE_INTERACTIVE: 0
      XMAKE_COLORTERM: none
      C_INCLUDE_PATH: /usr/include:/usr/include/musl
      LIBRARY_PATH: /usr/lib:/usr/lib/musl:/usr/lib/x86_64-linux-gnu:/usr/lib/aarch64-linux-gnu

    strategy:
      matrix:
        include:
          # 原有 Linux 版本（glibc）
          - os: ubuntu-latest
            platform: Linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: Linux
            arch: arm64
          # 新增 Linux musl 版本（静态编译）
          - os: ubuntu-latest
            platform: Linux
            arch: x64-musl
          - os: ubuntu-24.04-arm
            platform: Linux
            arch: arm64-musl
          # 原有 macOS/Windows 版本
          - os: macos-15-intel
            platform: macOS
            arch: Intel
          - os: macos-latest
            platform: macOS
            arch: arm64
          - os: windows-latest
            platform: Windows
            arch: x64
          - os: windows-11-arm
            platform: Windows
            arch: arm64

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v5

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ~3
          actions-cache-folder: ".xmake-cache"
          build-cache-key: "${{ matrix.platform }}_${{ matrix.arch }}"
          build-cache: true
          package-cache: true

      # x64-musl 专用工具链
      - name: Install Musl Toolchain (x64-musl)
        if: matrix.arch == 'x64-musl'
        run: |
          sudo apt update && sudo apt install -y --no-install-recommends \
            musl-tools gcc-multilib musl-dev
          sudo ln -sf /usr/bin/musl-gcc /usr/local/bin/gcc
          sudo ln -sf /usr/bin/musl-g++ /usr/local/bin/g++

      # arm64-musl 专用工具链
      - name: Install Musl Toolchain (arm64-musl)
        if: matrix.arch == 'arm64-musl'
        run: |
          sudo apt update && sudo apt install -y --no-install-recommends \
            musl-tools musl-dev
          sudo apt remove -y gcc-multilib gcc-13-aarch64-linux-gnu || true
          sudo ln -sf /usr/bin/musl-gcc /usr/local/bin/gcc
          sudo ln -sf /usr/bin/musl-g++ /usr/local/bin/g++

      # 核心修复：用管道强制输入 "y" 回答 Xmake 交互询问
      - name: Build & Package Project
        run: |
          # 提取纯架构
          ARCH_PURE="${{ matrix.arch }}"
          ARCH_PURE=${ARCH_PURE/-musl/}
          
          # 清理缓存
          xmake clean -a
          xmake f --clean
          
          if [[ "${{ matrix.arch }}" == *-musl ]]; then
            # 指定编译器和静态链接标志
            export CC=musl-gcc
            export CXX=musl-g++
            export CFLAGS="-static -fPIC -Os"
            export CXXFLAGS="-static -fPIC -Os"
            export LDFLAGS="-static -static-libgcc -static-libstdc++ -lm -lc -lpcre2-8"
            
            # 关键：echo y | 强制回答交互询问 + --yes 双重保险
            echo y | xmake f --yes \
              --plat=linux \
              --arch=${ARCH_PURE} \
              --mode=release \
              --cxflags="${CFLAGS} ${CXXFLAGS}" \
              --ldflags="${LDFLAGS}" \
              --linkdirs="/usr/lib/musl:/usr/lib/x86_64-linux-musl:/usr/lib/aarch64-linux-musl"
          
            # 强制安装依赖（管道输入 y）
            echo y | xmake require --yes --verbose
            
            # 构建（管道输入 y）
            echo y | xmake build --yes --verbose
            
            # 打包
            echo y | xmake package --yes --verbose
          else
            # 原有逻辑（同样加管道）
            echo y | xmake f --yes --mode=release
            echo y | xmake require --yes
            echo y | xmake build --yes --verbose
            echo y | xmake package --yes --verbose
          fi

      - name: Verify Static Link (musl only)
        if: contains(matrix.arch, 'musl')
        run: |
          BIN_PATH=$(find build/linux/${ARCH_PURE}/release -name "${PROJECT_NAME}" -type f)
          if [ -f "${BIN_PATH}" ]; then
            echo "✅ Binary found: ${BIN_PATH}"
            file ${BIN_PATH} | grep -i "statically linked" && echo "✅ Static link success"
            ldd ${BIN_PATH} || echo "✅ No dynamic dependencies (musl static confirmed)"
          else
            echo "❌ Binary not found!"
            exit 1
          fi

      - name: Upload Artifact
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/packages/*.zip
            build/packages/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  release:
    if: ${{ (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.deploy_type == 'release') }}
    name: Upload to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    env:
      RELEASE_DIR: "artifacts"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download All Artifacts
        uses: actions/download-artifact@v5
        with:
          path: ${{ env.RELEASE_DIR }}

      - name: Update dev Tag
        run: |
          git tag dev ${{ github.sha }}
          git push origin "refs/tags/dev" --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Continuous dev Build
          body: |
            Automated build from commit ${{ github.sha }}
            - Added Linux musl static build (x64/arm64)
            - Fixed: Force input "y" via pipe to bypass Xmake interactive prompt
            - Deploy type: ${{ github.event_name == 'push' && 'auto-release (push)' || inputs.deploy_type }}
          prerelease: true
          preserve_order: true
          files: |
            ${{ env.RELEASE_DIR }}/**/*.zip
            ${{ env.RELEASE_DIR }}/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  format:
    if: ${{ (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.deploy_type == 'release') }}
    name: Auto Format Code
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ~3
          actions-cache-folder: ".xmake-cache"

      - name: Format C/C++ files
        run: xmake format

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changed=0" >> $GITHUB_OUTPUT
          else
            echo "changed=1" >> $GITHUB_OUTPUT
          fi

      - name: Auto commit and push changes
        if: steps.check_changes.outputs.changed != 0
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "style(format): AUTO format code"
          branch: ${{ github.ref_name }}
          commit_options: "--no-verify --no-signoff"
          file_pattern: "*.h *.c"
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          status_options: "--untracked-files=no"
          add_options: "-u"
          disable_globbing: true